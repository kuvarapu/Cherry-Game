<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Game Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🍒 Cherry Game Debug Page</h1>

    <div class="test-section">
        <h3>Backend Health Check</h3>
        <button onclick="testHealth()">Test Backend Health</button>
        <div id="healthResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>User Registration Test</h3>
        <input type="text" id="testUsername" placeholder="Username" value="testuser3">
        <input type="password" id="testPassword" placeholder="Password" value="password123">
        <button onclick="testRegister()">Test Register</button>
        <div id="registerResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>User Login Test</h3>
        <button onclick="testLogin()">Test Login (testuser2)</button>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Game Creation Test</h3>
        <button onclick="testGameCreate()">Test Create Game</button>
        <div id="gameResult" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Go to Main Game</h3>
        <a href="index.html">Open Cherry Game</a>
    </div>

    <script>
        let authToken = null;

        async function testHealth() {
            const resultDiv = document.getElementById('healthResult');
            try {
                const response = await fetch('http://localhost:4000/health');
                const data = await response.json();
                resultDiv.innerHTML = `<span class="success">✅ Health check passed</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Health check failed: ${error.message}</span>`;
            }
        }

        async function testRegister() {
            const resultDiv = document.getElementById('registerResult');
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                const response = await fetch('http://localhost:4000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Registration successful</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Registration failed</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Registration error: ${error.message}</span>`;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                const response = await fetch('http://localhost:4000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    resultDiv.innerHTML = `<span class="success">✅ Login successful</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Login failed</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Login error: ${error.message}</span>`;
            }
        }

        async function testGameCreate() {
            const resultDiv = document.getElementById('gameResult');
            
            if (!authToken) {
                resultDiv.innerHTML = `<span class="error">❌ Please login first</span>`;
                return;
            }
            
            try {
                const response = await fetch('http://localhost:4000/api/game/start', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ mode: 'single', username: 'testuser2' })
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Game created successfully</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Game creation failed</span><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Game creation error: ${error.message}</span>`;
            }
        }

        // Auto-test on load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
